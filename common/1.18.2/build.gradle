plugins {
    id 'com.github.ksoichiro.mcmod'
}

architectury {
    common rootProject.ext.enabled_platforms.split(',')
}

loom {
    mixin {
        defaultRefmapName = "common-common-refmap.json"
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // TOML config library. Bundled into the Fabric jar via include(); provided at
    // runtime by NeoForge/Forge. Only needed on the compile classpath here.
    compileOnly "com.electronwill.night-config:core:3.8.3"
    compileOnly "com.electronwill.night-config:toml:3.8.3"
}

// Add generated NBT files to resource source set
sourceSets {
    main {
        resources {
            srcDir 'build/generated/nbt'
        }
    }
}

// NBT Structure Multi-Version Conversion
// Converts the 1.21.1 NBT structure files to the item format this version reads
// (legacy item tags instead of the data components introduced in 1.20.5), restamps
// the DataVersion, and renames the structure directory from singular to plural.
// The conversion runs on the JVM inside the shared mcmod plugin, so the build needs
// no python3/nbtlib on PATH. Only nbtConversion is enabled here: the multi-version
// and release tasks come from the script plugins applied in the root build.
mcmod {
    multiVersion {
        enabled = false
    }
    resourceValidation {
        enabled = false
    }
    nbtConversion {
        enabled = true
        sourceVersion = '1.21.1'
        targetVersion = '1.18.2'
        inputDir = rootProject.file('common/1.21.1/src/main/resources/data/beginnersdelight/structure')
        outputDir = file('build/generated/nbt/data/beginnersdelight/structures')
    }
}

// The plugin registers its own outputDir as a resource root, from an afterEvaluate
// block nested inside the one it registers when applied. Nest one level so this runs
// after it and takes that root back out: ours is the parent directory
// 'build/generated/nbt', which is what gives the files their
// data/beginnersdelight/structures/ path. Leaving both registered puts a second,
// unnamespaced copy of every structure at the JAR root.
project.afterEvaluate {
    project.afterEvaluate {
        sourceSets.main.resources.srcDirs = sourceSets.main.resources.srcDirs -
                file('build/generated/nbt/data/beginnersdelight/structures')
    }
}

// Expand pack_format variable in pack.mcmeta
processResources {
    inputs.property 'pack_format', project.ext.pack_format

    filesMatching('pack.mcmeta') {
        expand 'pack_format': project.ext.pack_format
    }

    // Guard the duplicate-resource-root removal above. If a future version of the
    // mcmod plugin changes how or when it registers its outputDir, that removal
    // silently stops matching and every structure is packaged twice: once under
    // data/beginnersdelight/structures/, once unnamespaced at the archive root.
    // Nothing else notices -- Minecraft ignores the stray copies -- so check the
    // packaged layout here instead.
    doLast {
        def stray = fileTree(dir: destinationDir, includes: ['*.nbt']).files
        if (!stray.isEmpty()) {
            throw new GradleException(
                "${stray.size()} structure file(s) landed at the resource root " +
                "(${destinationDir}): the duplicate resource root removal in this " +
                "file no longer matches what the mcmod plugin registers")
        }
        def packaged = fileTree(dir: destinationDir,
                includes: ['data/beginnersdelight/structures/*.nbt']).files
        if (packaged.isEmpty()) {
            throw new GradleException(
                "No converted structures under data/beginnersdelight/structures/ in " +
                "${destinationDir}: the conversion output is missing from resources")
        }
    }
}

// Set duplicates strategy for sourcesJar to avoid conflicts
tasks.named('sourcesJar') {
    dependsOn 'convertNbt'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
